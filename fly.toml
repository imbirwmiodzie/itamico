# Fly.io: `fly launch --copy-config --no-deploy`, then
# `fly secrets set DATABASE_URL=... MCP_TOKEN=...` and `fly deploy`.
app = "italian-tutor-mcp"
primary_region = "fra"   # same region as the database: each tool call makes a few DB round trips

[build]

[env]
  TUTOR_TZ = "Europe/Warsaw"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine warm: a cold start mid-ride is a long silence.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
