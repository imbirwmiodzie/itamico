plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.itamico.drill'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.itamico.drill'
        minSdk = 26
        targetSdk = 36
        versionCode = 1
        versionName = '1.0'
    }

    signingConfigs {
        // A fixed debug key (not a secret: the standard "android" passwords), so
        // an APK built by CI installs over one built in Android Studio and back.
        debug {
            storeFile = file('debug.keystore')
            storePassword = 'android'
            keyAlias = 'androiddebugkey'
            keyPassword = 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}
